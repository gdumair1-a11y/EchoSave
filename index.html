    <title>Voyager - Luxury Travel Agency</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              blue: {
                400: '#60a5fa',

              }
            }
          },
        },
